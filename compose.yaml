services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shell
    ports:
      - "5432:5432"
    volumes:
      - shell-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shell"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  shell-postgres:
